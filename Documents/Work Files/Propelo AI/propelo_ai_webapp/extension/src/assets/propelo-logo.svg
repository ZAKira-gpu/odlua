<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Propelo logo</title>
  <desc id="desc">Minimal, high-resolution Propelo mark: cyan orb with logotype</desc>
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#65E4F7" stop-opacity="1"/>
    </linearGradient>
    <filter id="f-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- Orb mark -->
  <g transform="translate(120,150)">
    <circle cx="0" cy="0" r="90" fill="url(#g1)" filter="url(#f-soft)" />
    <circle cx="-24" cy="-24" r="12" fill="#ffffff" opacity="0.06" />
    <circle cx="30" cy="30" r="8" fill="#ffffff" opacity="0.04" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(300,170)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="700" font-size="72" fill="#0A1B2F">Propelo</text>
  </g>
</svg>
