# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting

runConfig:
  # Runtime settings
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Public environment variables (available in browser)
  - variable: NEXT_PUBLIC_APP_URL
    value: https://app.propeloai.com
  - variable: NEXT_PUBLIC_APP_NAME
    value: Propelo AI
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sealthedeal-d48ef.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sealthedeal-d48ef
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: sealthedeal-d48ef.appspot.com
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "93180772152"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:93180772152:web:a81c798f20ea5277b00bcd
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-Z7DDF3M2TQ
  - variable: NEXT_PUBLIC_ENABLE_GOOGLE_AUTH
    value: "true"
  - variable: NEXT_PUBLIC_ENABLE_PAYMENTS
    value: "true"
  - variable: NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL
    value: https://propelo-ai.lemonsqueezy.com

  # Server-side secrets (stored in Secret Manager)
  - variable: FIREBASE_PROJECT_ID
    value: sealthedeal-d48ef
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  - variable: GOOGLE_CLIENT_ID
    secret: GOOGLE_CLIENT_ID
  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
  - variable: NEXTAUTH_URL
    value: https://app.propeloai.com
  - variable: LEMONSQUEEZY_API_KEY
    secret: LEMONSQUEEZY_API_KEY
  - variable: LEMONSQUEEZY_STORE_ID
    value: "226862"
  - variable: LEMONSQUEEZY_WEBHOOK_SECRET
    secret: LEMONSQUEEZY_WEBHOOK_SECRET
  - variable: LEMONSQUEEZY_STARTER_VARIANT_ID
    value: "1160539"
  - variable: LEMONSQUEEZY_PRO_VARIANT_ID
    value: "1160834"
