<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Propelo Extension Popup Preview</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="preview-card popup">
    <div class="center-logo">
      <!-- Use logos from brand-assets/logos for the preview -->
      <img src="../logos/propelo-logo.svg" alt="Propelo" style="height:64px;" />
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <div>
        <div style="font-weight:700;color:#0A1B2F">Current Job Detected</div>
        <div style="font-size:13px;color:#64748B">E-commerce site redesign — Upwork</div>
      </div>
      <div class="small" style="background:linear-gradient(90deg,#00C2FF,#65E4F7);border-radius:12px;padding:6px">
        <img src="../logos/logo-icon.png" alt="icon" style="height:28px; width:auto; display:block" />
      </div>
    </div>

    <div class="usage">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:12px;color:#64748B">Proposals Used</div>
        <div style="font-weight:700;color:#00C2FF">3 / 10</div>
      </div>
      <div style="height:8px;background:#e6eef5;border-radius:8px;margin-top:8px;overflow:hidden">
        <div style="width:30%;height:100%;background:linear-gradient(90deg,#00C2FF,#65E4F7)"></div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button style="flex:1;background:#00C2FF;color:#fff;padding:10px;border-radius:12px;border:none;font-weight:600">Generate</button>
      <button style="width:44px;background:#fff;border:1px solid #D5E0EA;border-radius:10px">⟳</button>
    </div>

    <div style="text-align:center;color:#94A3B8;font-size:12px;margin-top:12px">This is a static preview of the extension popup using your logos.</div>
  </div>
</body>
</html>
