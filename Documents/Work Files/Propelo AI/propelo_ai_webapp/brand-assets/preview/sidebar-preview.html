<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Propelo Sidebar Preview</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div style="display:flex;gap:24px;align-items:flex-start">
    <div class="sidebar">
      <div class="logo">
        <img src="../logos/propelo-logo.svg" alt="Propelo" style="height:44px;" />
      </div>

      <div class="nav">
        <div class="nav-item active">
          <div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(90deg,#E1F8FF,#EAF9FB);display:flex;align-items:center;justify-content:center">✨</div>
          <div>Generator</div>
        </div>
        <div class="nav-item" style="margin-top:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:#F7F9FB;display:flex;align-items:center;justify-content:center">📜</div>
          <div>History</div>
        </div>
        <div class="nav-item" style="margin-top:8px">
          <div style="width:36px;height:36px;border-radius:8px;background:#F7F9FB;display:flex;align-items:center;justify-content:center">📊</div>
          <div>Analytics</div>
        </div>
      </div>

      <div class="footer">Proposals used: <strong style="color:#00C2FF">3/10</strong></div>
    </div>

    <div style="flex:1">
      <div style="max-width:820px">
        <div style="background:#fff;border-radius:12px;border:1px solid #D5E0EA;padding:20px;box-shadow:0 6px 20px rgba(10,27,47,0.04)">
          <div style="display:flex;align-items:center;gap:16px">
            <img src="../logos/logo-banner.png" alt="banner" style="height:64px;" />
            <div>
              <div style="font-weight:700;font-size:20px;color:#0A1B2F">Welcome back</div>
              <div style="color:#64748B">Here are your recent proposals</div>
            </div>
          </div>

          <div style="margin-top:18px">
            <div style="background:#F7F9FB;border-radius:10px;padding:12px;border:1px solid #E6EEF5">Sample proposal card — uses card styles from theme</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top:28px;color:#64748B;font-size:13px">Open these files locally from <code>brand-assets/preview/</code> to see the rebrand immediately.</div>
</body>
</html>
