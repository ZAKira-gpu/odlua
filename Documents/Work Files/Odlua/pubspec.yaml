name: odlua
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.1.5 <4.0.0'



#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Utility Packages
  http: ^1.3.0
  intl: ^0.19.0
  logger: ^2.5.0
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.6
  smooth_page_indicator: ^1.2.0+3
  connectivity_plus: ^6.1.3
  lottie: ^3.3.1 # OR RIVE
  flutter_svg: ^2.0.7


  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  provider: ^6.0.5

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  capped_progress_indicator: ^0.0.2

  # Firebase
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  easy_localization: ^3.0.8
  intl_utils: ^2.8.11
  flutter_translate: ^4.0.4
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.0.1
  permission_handler: ^12.0.1
  step_progress_indicator: ^1.0.2
  hexcolor: ^3.0.1
  intl_phone_field: ^3.2.0
  cached_network_image: ^3.4.1
  credit_card_validator: ^2.1.0
  shimmer: ^3.0.0
  firebase_functions: ^0.0.1-dev
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  hive: ^2.2.3
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0



  #--------------- ./ PACKAGES END ------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2


flutter:
  generate: true
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/images/
    - assets/i18n/
    - assets/logos/
    - assets/payment_methods/
    - assets/images/onboarding/
    - assets/illustrations/category_row/


  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800

flutter_native_splash:
  color: "#197533"
  image: assets/odlua_simple_logo.png
  android_gravity: center
  android: true
  ios: true
  web: true
  ios_content_mode: center
  fullscreen: true
  android_12:
    image: assets/odlua_simple_logo.png
    icon_background_color: "#197533"
    image_dark: assets/odlua_simple_logo.png
    icon_background_color_dark: "#197533"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/odlua_simple_logo.png  # path to your image/logo
