name: odlua
description: Odlua – Share homemade food with your community.

publish_to: 'none'
version: 2.1.3+21

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  # ── Core ──
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase & Backend ──
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.2
  firebase_remote_config: ^5.1.7
  firebase_messaging: ^15.2.10

  # ── State Management ──
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  get: ^4.6.6                       # Router & reactive state
  get_storage: ^2.1.1               # Lightweight key-value store
  provider: ^6.0.5

  # ── Networking & Data ──
  http: ^1.3.0
  shared_preferences: ^2.5.3
  hive: ^2.2.3                      # Fast local NoSQL storage
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3

  # ── Location & Maps ──
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  geocoding: ^4.0.0

  # ── UI Components ──
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  carousel_slider: ^5.0.0
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1
  capped_progress_indicator: ^0.0.2
  step_progress_indicator: ^1.0.2
  photo_view: ^0.15.0
  hexcolor: ^3.0.1
  video_player: ^2.10.1

  # ── Notifications ──
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1

  # ── Localization ──
  easy_localization: ^3.0.8
  intl: any

  # ── Forms & Input ──
  intl_phone_field: ^3.2.0
  credit_card_validator: ^2.1.0
  image_picker: ^1.1.2

  # ── Utilities ──
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  permission_handler: ^12.0.1
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_native_splash: ^2.4.6     # Build-time only: splash generation
  flutter_launcher_icons: ^0.14.4   # Build-time only: icon generation
  change_app_package_name: ^1.5.0   # Build-time only: package rename


flutter:
  generate: true
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/images/
    - assets/splash_video.mp4
    - assets/i18n/
    - assets/logos/
    - assets/payment_methods/
    - assets/images/onboarding/
    - assets/illustrations/category_row/


  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800

flutter_native_splash:
  color: "#197533"
  image: assets/logos/odlua_branded_splash.png
  android_gravity: center
  android: true
  ios: true
  web: true
  ios_content_mode: center
  fullscreen: true
  android_12:
    image: assets/logos/odlua_branded_splash.png
    icon_background_color: "#197533"
    image_dark: assets/logos/odlua_branded_splash.png
    icon_background_color_dark: "#197533"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logos/odlua_logo_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#197533"
  adaptive_icon_foreground: assets/logos/odlua_logo_icon.png
